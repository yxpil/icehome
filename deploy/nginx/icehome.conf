# ICEHOME 前后端分离部署示例（nginx）
#
# 拓扑：
#   浏览器 → nginx:80 ─┬─ /            静态文件 dist
#                      ├─ /api/*       反向代理 → ICEHOME API（SERVE_STATIC=false）
#                      └─ /v1/*        反向代理 → ICEHOME API（SSE 不缓冲）
#
# 使用：
#   1. npm run build
#   2. 将 dist 放到 /srv/icehome/dist（或修改下方 root）
#   3. SERVE_STATIC=false npm start 启动 API（监听 127.0.0.1:8787）
#   4. 把本文件放到 /etc/nginx/conf.d/icehome.conf，nginx -t && nginx -s reload

upstream icehome_api {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    server_name icehome.local;

    root /srv/icehome/dist;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 带指纹的构建产物可以长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 单页应用回退；入口文件不缓存，保证发布后立即生效
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # REST API：普通请求，关闭 nginx 层缓存，缓存由应用或网关控制
    location /api/ {
        proxy_pass http://icehome_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # OpenAI 兼容端点：/v1/chat/completions 支持 SSE，必须关闭缓冲
    location /v1/ {
        proxy_pass http://icehome_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }
}

